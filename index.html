<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
/>

<title>Phim Hay VN</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.player{
    position:relative;
    width:100%;
    background:#000;
}

video{
    display:block;
    width:100%;
    height:auto;
    min-height:220px;
    max-height:75vh;
    background:#000;
}

.container{
    width:100%;
    max-width:1000px;
    margin:auto;
}

.info{
    padding:18px;
}

.poster{
    width:110px;
    height:160px;
    object-fit:cover;
    border-radius:8px;
    float:left;
    margin-right:15px;
    margin-bottom:10px;
}

.title{
    font-size:24px;
    font-weight:700;
    margin-bottom:6px;
}

.origin{
    color:#aaa;
    margin-bottom:12px;
}

.meta{
    color:#ccc;
    font-size:14px;
    line-height:1.7;
}

.description{
    clear:both;
    padding-top:15px;
    color:#ccc;
    line-height:1.7;
}

.fullscreen{
    margin-top:15px;
    padding:12px 18px;
    border:0;
    border-radius:7px;
    background:#e50914;
    color:white;
    font-size:15px;
    cursor:pointer;
}

.error{
    padding:30px 18px;
    color:#ff5555;
}

</style>
</head>

<body>

<div class="container">

    <div class="player">

        <video
            id="video"
            controls
            playsinline
            preload="metadata">
        </video>

    </div>

    <div class="info">

        <img
            id="poster"
            class="poster"
            style="display:none"
        >

        <div
            id="title"
            class="title">
            Phim Hay VN
        </div>

        <div
            id="origin"
            class="origin">
        </div>

        <div
            id="meta"
            class="meta">
        </div>

        <div
            id="description"
            class="description">
        </div>

        <button
            id="fullscreen"
            class="fullscreen">
            ⛶ Toàn màn hình
        </button>

    </div>

</div>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const videoUrl =
    params.get("url") || "";

const title =
    params.get("title") || "Phim Hay VN";

const episode =
    params.get("episode") || "";

const poster =
    params.get("poster") || "";

const origin =
    params.get("origin") || "";

const year =
    params.get("year") || "";

const quality =
    params.get("quality") || "";

const lang =
    params.get("lang") || "";

const description =
    params.get("description") || "";


document.getElementById(
    "title"
).textContent = title;


document.getElementById(
    "origin"
).textContent =
    origin +
    (year ? ` (${year})` : "");


document.getElementById(
    "meta"
).textContent =
    [
        episode ? `📺 ${episode}` : "",
        quality ? `🎞 ${quality}` : "",
        lang ? `🗣 ${lang}` : ""
    ]
    .filter(Boolean)
    .join("  •  ");


document.getElementById(
    "description"
).textContent =
    description;


if(poster){

    const image =
        document.getElementById(
            "poster"
        );

    image.src = poster;
    image.style.display = "block";
}


const video =
    document.getElementById(
        "video"
    );


function playVideo(){

    if(!videoUrl){

        document.body.innerHTML =
            '<div class="error">❌ Không có link video.</div>';

        return;
    }


    /*
     * M3U8
     */

    if(
        videoUrl
            .toLowerCase()
            .includes(".m3u8")
    ){

        /*
         * Safari / iPhone
         * hỗ trợ HLS native
         */

        if(
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ){

            video.src =
                videoUrl;

            return;
        }


        /*
         * Hls.js
         */

        if(
            typeof Hls !== "undefined"
            &&
            Hls.isSupported()
        ){

            const hls =
                new Hls({
                    enableWorker:true,
                    lowLatencyMode:false
                });

            hls.loadSource(
                videoUrl
            );

            hls.attachMedia(
                video
            );

            hls.on(
                Hls.Events.ERROR,
                function(
                    event,
                    data
                ){

                    console.error(
                        "HLS ERROR",
                        data
                    );

                }
            );

            return;
        }
    }


    /*
     * MP4 hoặc link video trực tiếp
     */

    video.src =
        videoUrl;
}


document.getElementById(
    "fullscreen"
).addEventListener(
    "click",
    async function(){

        try{

            if(
                video.requestFullscreen
            ){

                await video.requestFullscreen();

            }else if(
                video.webkitEnterFullscreen
            ){

                video.webkitEnterFullscreen();

            }else if(
                document.documentElement
                    .requestFullscreen
            ){

                await document
                    .documentElement
                    .requestFullscreen();
            }

        }catch(error){

            console.error(
                error
            );

        }

    }
);


playVideo();

</script>

</body>
</html>
