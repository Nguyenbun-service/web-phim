<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>Phim Hay VN</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        body {
            overflow: hidden;
        }

        .app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .header {
            flex: 0 0 auto;
            padding:
                calc(env(safe-area-inset-top) + 14px)
                16px
                12px;

            background: #080808;
            border-bottom: 1px solid #222;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
        }

        .episode {
            margin-top: 5px;
            font-size: 13px;
            color: #aaa;
        }

        .player-area {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .loading {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
            text-align: center;

            color: #bbb;
            font-size: 14px;

            pointer-events: none;
        }

        .loading.hidden {
            display: none;
        }

        .error {
            position: absolute;
            left: 20px;
            right: 20px;
            top: 50%;

            transform: translateY(-50%);

            padding: 20px;

            border: 1px solid #333;
            border-radius: 12px;

            background: rgba(15, 15, 15, 0.96);

            color: #ddd;
            text-align: center;

            font-size: 14px;
            line-height: 1.5;

            display: none;
        }

        .error.show {
            display: block;
        }

        .footer {
            flex: 0 0 auto;

            padding:
                10px
                16px
                calc(env(safe-area-inset-bottom) + 10px);

            background: #080808;
            border-top: 1px solid #222;

            color: #777;
            font-size: 11px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">
        <div
            id="title"
            class="brand"
        >
            Phim Hay VN
        </div>

        <div
            id="episode"
            class="episode"
        >
            Đang tải nguồn phát...
        </div>
    </header>

    <main class="player-area">

        <video
            id="video"
            controls
            playsinline
            webkit-playsinline
            preload="metadata"
        ></video>

        <div
            id="loading"
            class="loading"
        >
            Đang tải nguồn phát...
        </div>

        <div
            id="error"
            class="error"
        >
            Không thể phát nguồn phim.
        </div>

    </main>

    <footer class="footer">
        Phim Hay VN
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.2/dist/hls.min.js"></script>

<script>
(function () {

    "use strict";

    const params = new URLSearchParams(
        window.location.search
    );

    const title =
        params.get("title") ||
        "Phim Hay VN";

    const episode =
        params.get("episode") ||
        "";

    const stream =
        params.get("stream") ||
        "";

    const video =
        document.getElementById("video");

    const titleElement =
        document.getElementById("title");

    const episodeElement =
        document.getElementById("episode");

    const loadingElement =
        document.getElementById("loading");

    const errorElement =
        document.getElementById("error");

    titleElement.textContent =
        title;

    episodeElement.textContent =
        episode || "Nguồn phát";

    function showLoading() {
        loadingElement.classList.remove(
            "hidden"
        );
    }

    function hideLoading() {
        loadingElement.classList.add(
            "hidden"
        );
    }

    function showError(message) {
        hideLoading();

        errorElement.textContent =
            message;

        errorElement.classList.add(
            "show"
        );
    }

    function isValidStream(url) {

        if (!url) {
            return false;
        }

        if (
            !url.startsWith("https://") &&
            !url.startsWith("http://")
        ) {
            return false;
        }

        const lower =
            url.toLowerCase();

        return (
            lower.includes(".m3u8") ||
            lower.includes(
                "streamvsmov.com/video/"
            )
        );
    }

    function startPlayer() {

        if (!isValidStream(stream)) {

            showError(
                "Không nhận được nguồn M3U8 từ Telegram Bot."
            );

            return;
        }

        showLoading();

        /*
         * iPhone / Safari:
         * dùng HLS native.
         */

        if (
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            video.src = stream;

            video.addEventListener(
                "loadedmetadata",
                function () {
                    hideLoading();
                },
                {
                    once: true
                }
            );

            video.addEventListener(
                "error",
                function () {
                    showError(
                        "Nguồn M3U8 không thể phát trên thiết bị này."
                    );
                }
            );

            return;
        }

        /*
         * Chrome / Android / Desktop:
         * dùng HLS.js.
         */

        if (
            window.Hls &&
            Hls.isSupported()
        ) {

            const hls =
                new Hls({
                    enableWorker: true,
                    lowLatencyMode: false,
                });

            hls.loadSource(
                stream
            );

            hls.attachMedia(
                video
            );

            hls.on(
                Hls.Events.MANIFEST_PARSED,
                function () {

                    hideLoading();

                    /*
                     * Không tự động phát.
                     * Người dùng bấm Play.
                     */

                }
            );

            hls.on(
                Hls.Events.ERROR,
                function (
                    event,
                    data
                ) {

                    if (
                        data &&
                        data.fatal
                    ) {

                        showError(
                            "Không thể tải nguồn M3U8."
                        );

                        try {
                            hls.destroy();
                        } catch (e) {}
                    }
                }
            );

            return;
        }

        showError(
            "Thiết bị hoặc trình duyệt không hỗ trợ HLS."
        );
    }

    startPlayer();

})();
</script>

</body>
</html>
