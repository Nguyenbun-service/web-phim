<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>Phim Hay Chất Lượng Cao</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    background: #050505;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body {
    overflow-x: hidden;
}

.background {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at top right,
            rgba(255, 0, 0, .16),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(255, 0, 0, .08),
            transparent 35%
        );

    z-index: -1;
}

.header {
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.95),
            rgba(0,0,0,.35)
        );

    position: sticky;
    top: 0;
    z-index: 10;

    backdrop-filter: blur(15px);
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -.5px;
}

.logo span {
    color: #e50914;
}

.badge {
    font-size: 12px;
    font-weight: 700;

    padding: 7px 11px;

    border-radius: 999px;

    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
}

.container {
    width: min(1250px, 94%);
    margin: auto;
    padding: 28px 0 60px;
}

.hero {
    margin-bottom: 25px;
}

.title {
    font-size: clamp(24px, 5vw, 42px);
    font-weight: 900;
    margin-bottom: 7px;
}

.subtitle {
    color: #aaa;
    font-size: 14px;
}

.player-card {
    background: #0c0c0c;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius: 18px;

    overflow: hidden;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.55);
}

.video-wrapper {
    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000;
}

video {
    width: 100%;
    height: 100%;

    display: block;

    background: #000;
}

.loading {
    position: absolute;

    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,.45);

    pointer-events: none;

    transition: opacity .25s;
}

.loading.hidden {
    opacity: 0;
}

.spinner {
    width: 45px;
    height: 45px;

    border-radius: 50%;

    border:
        3px solid
        rgba(255,255,255,.18);

    border-top-color: #fff;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.info {
    padding: 22px;
}

.info-title {
    font-size: 23px;
    font-weight: 850;

    margin-bottom: 5px;
}

.episode {
    color: #aaa;
    font-size: 14px;
}

.actions {
    display: flex;
    gap: 10px;

    flex-wrap: wrap;

    margin-top: 18px;
}

.btn {
    border: 0;

    padding: 12px 17px;

    border-radius: 10px;

    color: white;

    background: #191919;

    cursor: pointer;

    font-weight: 700;

    transition:
        transform .15s,
        background .15s;
}

.btn:hover {
    transform: translateY(-1px);
    background: #292929;
}

.btn.primary {
    background: #e50914;
}

.btn.primary:hover {
    background: #f6121d;
}

.status {
    margin-top: 18px;

    padding: 13px 15px;

    border-radius: 10px;

    background: rgba(255,255,255,.045);

    color: #aaa;

    font-size: 13px;

    display: none;
}

.status.show {
    display: block;
}

.footer {
    text-align: center;

    margin-top: 35px;

    color: #555;

    font-size: 12px;
}

@media(max-width: 600px) {

    .header {
        height: 62px;
        padding: 0 17px;
    }

    .logo {
        font-size: 18px;
    }

    .container {
        width: 100%;
        padding-top: 12px;
    }

    .hero,
    .info {
        padding-left: 15px;
        padding-right: 15px;
    }

    .player-card {
        border-radius: 0;
        border-left: 0;
        border-right: 0;
    }

    .info-title {
        font-size: 19px;
    }
}

</style>
</head>

<body>

<div class="background"></div>

<header class="header">

    <div class="logo">
        PHIM <span>HAY</span>
    </div>

    <div class="badge">
        HD • VIETSUB
    </div>

</header>

<main class="container">

    <section class="hero">

        <h1
            id="movieTitle"
            class="title"
        >
            Đang tải...
        </h1>

        <p class="subtitle">
            🎬 Phim Hay Chất Lượng Cao
        </p>

    </section>

    <section class="player-card">

        <div class="video-wrapper">

            <video
                id="video"
                controls
                playsinline
                preload="metadata"
            ></video>

            <div
                id="loading"
                class="loading"
            >
                <div class="spinner"></div>
            </div>

        </div>

        <div class="info">

            <div
                id="infoTitle"
                class="info-title"
            >
                Phim Hay
            </div>

            <div
                id="episode"
                class="episode"
            >
                Đang tải video...
            </div>

            <div class="actions">

                <button
                    id="playBtn"
                    class="btn primary"
                >
                    ▶️ Phát
                </button>

                <button
                    id="fullscreenBtn"
                    class="btn"
                >
                    ⛶ Toàn màn hình
                </button>

            </div>

            <div
                id="status"
                class="status"
            ></div>

        </div>

    </section>

    <footer class="footer">
        Phim Hay Chất Lượng Cao
    </footer>

</main>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const stream =
    params.get("stream");

const title =
    params.get("title")
    || "Phim Hay";

const episode =
    params.get("episode")
    || "";

const video =
    document.getElementById("video");

const loading =
    document.getElementById("loading");

const status =
    document.getElementById("status");

const movieTitle =
    document.getElementById("movieTitle");

const infoTitle =
    document.getElementById("infoTitle");

const episodeElement =
    document.getElementById("episode");

const playBtn =
    document.getElementById("playBtn");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");


movieTitle.textContent =
    title;

infoTitle.textContent =
    title;

episodeElement.textContent =
    episode
        ? "▶️ " + episode
        : "▶️ Phim";


function showStatus(message) {

    status.textContent =
        message;

    status.classList.add(
        "show"
    );
}


function hideLoading() {

    loading.classList.add(
        "hidden"
    );
}


function showLoading() {

    loading.classList.remove(
        "hidden"
    );
}


async function playVideo() {

    try {

        await video.play();

    } catch (error) {

        showStatus(
            "Nhấn nút ▶️ Phát để bắt đầu video."
        );

    }

}


function loadVideo() {

    if (!stream) {

        hideLoading();

        showStatus(
            "❌ Không tìm thấy link video."
        );

        return;
    }

    showLoading();

    const isHLS =
        stream.includes(".m3u8")
        || stream.includes("m3u8?");


    /*
     * Safari / iPhone hỗ trợ HLS native.
     */
    if (
        isHLS
        && video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src =
            stream;

        video.load();

        return;
    }


    /*
     * Chrome / Edge / Firefox:
     * sử dụng hls.js.
     */
    if (
        isHLS
        && window.Hls
        && Hls.isSupported()
    ) {

        const hls =
            new Hls({
                enableWorker: true,
                lowLatencyMode: false
            });

        hls.loadSource(
            stream
        );

        hls.attachMedia(
            video
        );

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function() {

                hideLoading();

            }
        );

        hls.on(
            Hls.Events.ERROR,
            function(
                event,
                data
            ) {

                if (
                    data.fatal
                ) {

                    hideLoading();

                    showStatus(
                        "❌ Video không thể phát. "
                        + "Link stream có thể đã hết hạn."
                    );

                }

            }
        );

        return;
    }


    /*
     * MP4 / video trực tiếp.
     */
    video.src =
        stream;

    video.load();

}


video.addEventListener(
    "loadeddata",
    hideLoading
);

video.addEventListener(
    "canplay",
    hideLoading
);

video.addEventListener(
    "waiting",
    showLoading
);

video.addEventListener(
    "playing",
    hideLoading
);

video.addEventListener(
    "error",
    function() {

        hideLoading();

        showStatus(
            "❌ Không thể phát video. "
            + "Hãy thử lại hoặc báo lỗi phim."
        );

    }
);


playBtn.addEventListener(
    "click",
    playVideo
);


fullscreenBtn.addEventListener(
    "click",
    async function() {

        try {

            if (
                document.fullscreenElement
            ) {

                await document.exitFullscreen();

                return;
            }

            if (
                video.requestFullscreen
            ) {

                await video.requestFullscreen();

            } else if (
                video.webkitEnterFullscreen
            ) {

                video.webkitEnterFullscreen();

            }

        } catch (error) {

            console.log(error);

        }

    }
);


loadVideo();

</script>

</body>
</html>
