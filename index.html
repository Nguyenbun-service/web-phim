<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phim Hay Chất Lượng Cao</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --netflix-red: #E50914;
            --bg-color: #141414;
            --text-color: #FFFFFF;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
        }
        .header {
            padding: 15px; display: flex; justify-content: space-between;
            align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            position: absolute; top: 0; left: 0; width: 100%; z-index: 10; box-sizing: border-box;
        }
        .logo { color: var(--netflix-red); font-size: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .movie-title { font-size: 14px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; text-align: right;}
        .player-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #000; width: 100%; height: 100%; }
        video { width: 100%; height: 100%; max-height: 100vh; outline: none; }
        .error-msg { color: #fff; text-align: center; display: none; padding: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">HAYPHIM</div>
        <div class="movie-title" id="displayTitle">Đang tải...</div>
    </div>

    <div class="player-container">
        <video id="videoPlayer" controls autoplay playsinline></video>
        <div class="error-msg" id="errorMsg">Video không thể phát hoặc bị lỗi định dạng. Vui lòng thử lại sau!</div>
    </div>

    <script>
        // Lấy thông số từ URL do Bot gửi sang
        const urlParams = new URLSearchParams(window.location.search);
        const videoSrc = urlParams.get('url');
        const title = urlParams.get('title');

        if (title) document.getElementById('displayTitle').innerText = title;

        const video = document.getElementById('videoPlayer');
        const errorMsg = document.getElementById('errorMsg');

        // Khởi tạo Telegram Web App để tối ưu hiển thị
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand(); // Mở full màn hình

        if (videoSrc) {
            if (Hls.isSupported()) {
                const hls = new Hls({ debug: false });
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.log("Cần tương tác để phát video"));
                });
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        video.style.display = 'none';
                        errorMsg.style.display = 'block';
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Hỗ trợ native cho iOS/Safari
                video.src = videoSrc;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        } else {
            video.style.display = 'none';
            errorMsg.innerText = "Không tìm thấy link video!";
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>
