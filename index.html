<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Phim Hay Chất Lượng Cao</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #050505;
    color: #fff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {
    overflow-x: hidden;
}

.header {

    height: 64px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 18px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.98),
            rgba(0,0,0,.72)
        );

    position: sticky;

    top: 0;

    z-index: 20;

}

.logo {

    font-size: 21px;

    font-weight: 900;

    letter-spacing: -.5px;

}

.logo span {
    color: #e50914;
}

.header-btn {

    border: 0;

    background: rgba(255,255,255,.1);

    color: white;

    width: 42px;

    height: 42px;

    border-radius: 50%;

    font-size: 18px;

}

.hero {

    position: relative;

    width: 100%;

    max-width: 1500px;

    margin: auto;

}

.player-wrapper {

    width: 100%;

    background: #000;

    aspect-ratio: 16 / 9;

    position: relative;

    overflow: hidden;

}

video {

    width: 100%;

    height: 100%;

    display: block;

    background: #000;

    object-fit: contain;

}

.loading {

    position: absolute;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background: rgba(0,0,0,.75);

    z-index: 5;

}

.spinner {

    width: 48px;

    height: 48px;

    border-radius: 50%;

    border: 4px solid rgba(255,255,255,.2);

    border-top-color: white;

    animation: spin .8s linear infinite;

}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}

.content {

    max-width: 1200px;

    margin: auto;

    padding: 28px 18px 60px;

}

.badge {

    display: inline-block;

    background: #e50914;

    padding: 6px 11px;

    border-radius: 5px;

    font-size: 12px;

    font-weight: bold;

    margin-bottom: 12px;

}

.title {

    font-size: clamp(
        24px,
        5vw,
        42px
    );

    font-weight: 800;

    margin-bottom: 8px;

}

.episode {

    font-size: 16px;

    color: #bbb;

    margin-bottom: 24px;

}

.actions {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

}

.btn {

    border: 0;

    border-radius: 6px;

    padding: 13px 18px;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    color: white;

    background: #222;

}

.btn-primary {

    background: white;

    color: black;

}

.btn-danger {

    background: #e50914;

}

.btn:active {

    transform: scale(.97);

}

.info {

    margin-top: 30px;

    padding-top: 24px;

    border-top:
        1px solid
        rgba(255,255,255,.12);

}

.info h2 {

    font-size: 20px;

    margin-bottom: 12px;

}

.info p {

    color: #aaa;

    line-height: 1.7;

}

.error {

    display: none;

    padding: 20px;

    background: #171717;

    border-radius: 8px;

    margin-top: 20px;

    color: #ff7777;

}

.footer {

    text-align: center;

    color: #666;

    font-size: 12px;

    padding: 30px;

}

@media (max-width: 600px) {

    .header {
        height: 56px;
    }

    .logo {
        font-size: 18px;
    }

    .content {
        padding: 20px 14px 40px;
    }

    .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .btn {
        width: 100%;
    }

}

</style>
</head>

<body>

<header class="header">

    <div class="logo">
        PHIM <span>HAY</span>
    </div>

    <button
        class="header-btn"
        onclick="goBack()"
    >
        ←
    </button>

</header>


<main>

<section class="hero">

    <div class="player-wrapper">

        <div
            id="loading"
            class="loading"
        >
            <div class="spinner"></div>
        </div>

        <video
            id="video"
            controls
            playsinline
            preload="metadata"
        ></video>

    </div>

</section>


<section class="content">

    <div class="badge">
        HD • VIETSUB
    </div>

    <h1
        id="title"
        class="title"
    >
        Đang tải...
    </h1>

    <div
        id="episode"
        class="episode"
    >
        Đang tải tập phim...
    </div>


    <div class="actions">

        <button
            class="btn btn-primary"
            onclick="playVideo()"
        >
            ▶ Xem Ngay
        </button>

        <button
            class="btn"
            onclick="toggleFullscreen()"
        >
            ⛶ Toàn màn hình
        </button>

        <button
            class="btn btn-danger"
            onclick="reportError()"
        >
            🚨 Báo lỗi phim
        </button>

    </div>


    <div
        id="errorBox"
        class="error"
    >
        Không thể phát video.

        <br><br>

        Có thể server video đang lỗi,
        link đã hết hạn hoặc định dạng
        không được trình duyệt hỗ trợ.
    </div>


    <div class="info">

        <h2>
            🎬 Phim Hay Chất Lượng Cao
        </h2>

        <p>
            Trình phát phim tối ưu cho điện thoại,
            máy tính bảng và máy tính.
        </p>

    </div>

</section>

</main>


<footer class="footer">

    PHIM HAY CHẤT LƯỢNG CAO

</footer>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const videoUrl =
    params.get("url") || "";

const movieTitle =
    params.get("title") ||
    "Phim Hay";

const episodeName =
    params.get("episode") ||
    "Tập phim";


const video =
    document.getElementById(
        "video"
    );

const loading =
    document.getElementById(
        "loading"
    );

const title =
    document.getElementById(
        "title"
    );

const episode =
    document.getElementById(
        "episode"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );


title.textContent =
    decodeURIComponent(
        movieTitle
    );

episode.textContent =
    "📺 " +
    decodeURIComponent(
        episodeName
    );


function hideLoading() {

    loading.style.display =
        "none";

}


function showError() {

    loading.style.display =
        "none";

    errorBox.style.display =
        "block";

}


function playVideo() {

    video.play()
        .catch(() => {});

}


function toggleFullscreen() {

    if (
        document.fullscreenElement
    ) {

        document.exitFullscreen();

        return;
    }

    if (
        video.requestFullscreen
    ) {

        video.requestFullscreen();

    } else if (
        video.webkitEnterFullscreen
    ) {

        video.webkitEnterFullscreen();

    }

}


function goBack() {

    if (
        document.referrer
    ) {

        history.back();

    } else {

        window.close();

    }

}


function reportError() {

    const message =
        encodeURIComponent(
            "Người dùng báo lỗi: " +
            movieTitle +
            " - " +
            episodeName
        );

    alert(
        "Đã ghi nhận báo lỗi.\n\n" +
        "Vui lòng quay lại Telegram " +
        "và bấm nút Báo Lỗi Phim."
    );

}


function loadVideo() {

    if (!videoUrl) {

        showError();

        return;
    }


    /*
     * HLS / M3U8
     */

    if (
        videoUrl.includes(".m3u8")
    ) {

        if (
            window.Hls &&
            Hls.isSupported()
        ) {

            const hls =
                new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                });

            hls.loadSource(
                videoUrl
            );

            hls.attachMedia(
                video
            );

            hls.on(
                Hls.Events.MANIFEST_PARSED,
                function() {

                    hideLoading();

                }
            );

            hls.on(
                Hls.Events.ERROR,
                function(
                    event,
                    data
                ) {

                    console.error(
                        "HLS ERROR",
                        data
                    );

                    if (
                        data.fatal
                    ) {

                        showError();

                    }

                }
            );

        } else if (
            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )
        ) {

            /*
             * Safari / iPhone
             */

            video.src =
                videoUrl;

            video.addEventListener(
                "loadedmetadata",
                hideLoading
            );

        } else {

            showError();

        }

    } else {

        /*
         * MP4 / video trực tiếp
         */

        video.src =
            videoUrl;

        video.addEventListener(
            "loadedmetadata",
            hideLoading
        );

    }

}


video.addEventListener(
    "error",
    function() {

        showError();

    }
);


video.addEventListener(
    "canplay",
    function() {

        hideLoading();

    }
);


loadVideo();

</script>

</body>
</html>
