<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="monetag" content="889c4a36432e66b9763007a112d5a2fa">
  <title>Xác nhận nhiệm vụ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 380px;
      width: 90%;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #f5c518;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 32px;
    }

    .step {
      display: none;
    }
    .step.active {
      display: block;
    }

    /* Step 1 — chờ */
    .wait-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .wait-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .wait-desc {
      font-size: 14px;
      color: #888;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .progress-bar {
      background: #222;
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f5c518, #ff8c00);
      border-radius: 99px;
      width: 0%;
      transition: width 0.5s linear;
    }

    .countdown {
      font-size: 13px;
      color: #555;
    }

    /* Step 2 — OTP */
    .otp-label {
      font-size: 14px;
      color: #888;
      margin-bottom: 12px;
    }

    .otp-box {
      background: #1e1e1e;
      border: 2px solid #f5c518;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .otp-code {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 10px;
      color: #f5c518;
      font-family: monospace;
    }

    .otp-desc {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .otp-desc code {
      background: #1e1e1e;
      color: #f5c518;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 14px;
    }

    .copy-btn {
      background: #f5c518;
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 12px 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }

    .copy-btn:active { opacity: 0.8; }

    .copied-msg {
      font-size: 13px;
      color: #4caf50;
      margin-top: 10px;
      display: none;
    }

    .expire-note {
      font-size: 12px;
      color: #444;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">⚡ EarnBot</div>
  <div class="subtitle">Nền tảng kiếm tiền online</div>

  <!-- Step 1: Chờ quảng cáo -->
  <div class="step active" id="step1">
    <div class="wait-icon">📺</div>
    <div class="wait-title">Đang tải quảng cáo...</div>
    <div class="wait-desc">
      Vui lòng chờ trong giây lát.<br>
      Mã xác nhận sẽ hiện sau khi hoàn tất.
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="countdown">Còn <span id="countdownNum">15</span> giây...</div>
  </div>

  <!-- Step 2: Hiển thị OTP -->
  <div class="step" id="step2">
    <div class="otp-label">✅ Hoàn tất! Mã xác nhận của bạn:</div>
    <div class="otp-box">
      <div class="otp-code" id="otpDisplay">------</div>
    </div>
    <div class="otp-desc">
      Nhập lệnh sau vào bot Telegram:<br>
      <code>/xn <span id="otpInline">------</span></code>
    </div>
    <button class="copy-btn" onclick="copyCode()">📋 Sao chép lệnh</button>
    <div class="copied-msg" id="copiedMsg">✅ Đã sao chép!</div>
    <div class="expire-note">⏳ Mã có hiệu lực trong 10 phút</div>
  </div>
</div>

<!-- Monetag Vignette -->
<script>(function(s){s.dataset.zone='10866699',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

<script>
  // Lấy OTP từ URL: hayphim.top/task?code=ABC123
  const params  = new URLSearchParams(window.location.search);
  const otp     = params.get('code') || '------';
  const WAIT_SEC = 15;

  document.getElementById('otpDisplay').textContent = otp;
  document.getElementById('otpInline').textContent  = otp;

  // Đếm ngược + progress bar
  let remaining = WAIT_SEC;
  const fill     = document.getElementById('progressFill');
  const num      = document.getElementById('countdownNum');

  const timer = setInterval(() => {
    remaining--;
    const pct = ((WAIT_SEC - remaining) / WAIT_SEC) * 100;
    fill.style.width = pct + '%';
    num.textContent  = remaining;

    if (remaining <= 0) {
      clearInterval(timer);
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
    }
  }, 1000);

  function copyCode() {
    const cmd = '/xn ' + otp;
    navigator.clipboard.writeText(cmd).then(() => {
      document.getElementById('copiedMsg').style.display = 'block';
      setTimeout(() => {
        document.getElementById('copiedMsg').style.display = 'none';
      }, 2000);
    });
  }
</script>

</body>
</html>
